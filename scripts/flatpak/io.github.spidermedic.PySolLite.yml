# Flatpak manifest for PySol Lite. Build with scripts/build_flatpak.sh.
# Python and Tcl/Tk are built from source because the Freedesktop runtime
# has no Tkinter. The pip step needs network access (fine for a local build;
# a Flathub submission needs the Python packages as pinned offline sources).
app-id: io.github.spidermedic.PySolLite
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pysol-lite
# flatpak-builder 1.2.x calls an `appstream-compose` binary the 25.08 SDK no
# longer ships, so composing is done by hand in the last module with
# `appstreamcli compose`. The catalog it writes to /app/share/app-info is what
# gets exported into the repo/bundle; without it software centers show no
# license, age rating, version or description.
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=x11          # Tk talks X11 only (XWayland on Wayland desktops)
  - --socket=pulseaudio   # sound effects (pygame)
  - --filesystem=xdg-documents  # save/load games, export

cleanup:
  - /include
  - /share/man
  - /lib/pkgconfig
  - '*.a'

modules:
  - name: tcl
    buildsystem: simple
    subdir: unix
    build-commands:
      - ./configure --prefix=/app --enable-threads
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
      - make install-private-headers
      - ln -sf tclsh8.6 /app/bin/tclsh
      - chmod -R u+w /app/lib /app/bin   # stripping needs writable libs
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5

  - name: tk
    buildsystem: simple
    subdir: unix
    build-commands:
      - ./configure --prefix=/app --with-tcl=/app/lib --enable-threads
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
      - make install-private-headers
      - chmod -R u+w /app/lib /app/bin
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tk8.6.16-src.tar.gz
        sha256: be9f94d3575d4b3099d84bc3c10de8994df2d7aa405208173c709cc404a7e5fe

  - name: python3
    build-options:
      env:
        LDFLAGS: -Wl,-rpath,/app/lib
    config-opts:
      - --enable-shared
      - --with-ensurepip=install
      - --without-static-libpython
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.10/Python-3.14.10.tar.xz
        sha256: de414a57119abef52784d8993e341d53aed635fc2b05c2607d9f98a2c5b72032
    post-install:
      - ln -sf python3 /app/bin/python
      - ln -sf pip3 /app/bin/pip

  - name: pysol-lite
    buildsystem: simple
    build-options:
      build-args:
        - --share=network   # pip downloads the wheels
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app attrs configobj pillow pygame-ce pysol-cards
      - install -d /app/share/pysol-lite
      - cp -r pysol.py pysollib data LICENSE.md THIRD-PARTY-LICENSES.md README.md /app/share/pysol-lite/
      - find /app/share/pysol-lite -name __pycache__ -prune -exec rm -rf {} +
      - install -Dm755 scripts/flatpak/pysol-lite.sh /app/bin/pysol-lite
      - install -Dm644 scripts/flatpak/io.github.spidermedic.PySolLite.desktop /app/share/applications/io.github.spidermedic.PySolLite.desktop
      - install -Dm644 scripts/flatpak/io.github.spidermedic.PySolLite.metainfo.xml /app/share/metainfo/io.github.spidermedic.PySolLite.metainfo.xml
      - for s in 16 32 48 128 512; do install -Dm644 data/images/icons/${s}x${s}/pysol.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.spidermedic.PySolLite.png; done
      - install -d /app/share/app-info/xmls /app/share/app-info/icons/flatpak
      - appstreamcli compose --prefix=/ --origin=flatpak --components=io.github.spidermedic.PySolLite --result-root=/run/build/pysol-lite/as-out --data-dir=/app/share/app-info/xmls --icons-dir=/app/share/app-info/icons/flatpak --hints-dir=/run/build/pysol-lite/as-hints /app
      - mv /app/share/app-info/xmls/flatpak.xml.gz /app/share/app-info/xmls/io.github.spidermedic.PySolLite.xml.gz
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - dist
          - build
          - .flatpak-builder
          - __pycache__
