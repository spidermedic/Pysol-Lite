<h1>Crossroads</h1>
<h2>Object</h2>
<p>
Move all cards to the foundations.

<h2>Quick Description</h2>
<p>
Like Junction,
but with four full decks, and seven tableau piles
of seven cards each, with the second, fourth, and sixth
card of each pile dealt face-down.  The foundation piles
are built up from ace to king.
