<h1>Brisbane</h1>
<h2>Object</h2>
<p>
Move all cards to the foundations.

<h2>Quick Description</h2>
<p>
Like <a href="yukon.html">Yukon</a>,
but during the initial deal, extra cards are dealt evenly to
all piles, and the piles build down regardless of suit.  Any card or
group of cards can be moved to an empty pile.
