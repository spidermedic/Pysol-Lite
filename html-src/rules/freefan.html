<h1>Free Fan</h1>
<h2>Object</h2>
<p>
Move all cards to the foundations.

<h2>Quick Description</h2>
<p>
Like <a href="fan.html">Fan</a>,
but with two extra free cells.  Sequences can be moved: as many cards as
you could move one at a time with the free cells you have empty, so one more
card than the number of empty free cells.
