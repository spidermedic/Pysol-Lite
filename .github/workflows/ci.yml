name: CI tests at GitHub

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check:

    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        python-version:
          - '3.10'
          - 3.11
          - 3.12
          - 3.13
          - 3.14

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{matrix.python-version}}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools
        python -m pip install flake8 flake8-import-order==0.19.2 \
          attrs configobj pycotap pysol-cards
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 . --show-source
    - name: Run unit tests
      run: |
        python -m unittest -v
    - name: Individually import each Python module
      run: |
        python scripts/gen_individual_importing_tests.py
        prove tests/individually-importing/*.py
